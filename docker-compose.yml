version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aethernode-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend/data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aethernode-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
